name: Verify SLAM entry points

on: [push, pull_request]

jobs:
  import-and-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py main_a.py pr3_utils.py
      - run: python main.py --help
      - run: python main_a.py --help
